<div class="agent-list">
  <!-- Loading State -->
  <div class="loading-container" *ngIf="loading">
    <nz-spin nzSize="large">
      <div class="loading-text">Loading agents...</div>
    </nz-spin>
  </div>

  <!-- Agent List Items -->
  <div class="list-container" *ngIf="!loading">
    <div 
      class="agent-list-item" 
      *ngFor="let agent of agents; trackBy: trackByAgentId"
      (click)="onAgentSelect(agent)">
      
      <!-- Agent Icon and Basic Info -->
      <div class="item-left">
        <div class="agent-icon" [style.background-color]="agent.ui.color">
          <i nz-icon [nzType]="agent.ui.icon" nzTheme="outline"></i>
        </div>
        
        <div class="agent-info">
          <h4 class="agent-name">{{ agent.name }}</h4>
          <p class="agent-description">{{ agent.description }}</p>
          
          <div class="agent-meta">
            <span class="agent-type">{{ agent.type }}</span>
            <span class="agent-version">v{{ agent.version }}</span>
            <span class="agent-category">{{ agent.category }}</span>
          </div>
        </div>
      </div>

      <!-- Agent Stats -->
      <div class="item-center">
        <div class="agent-stats">
          <div class="stat-item">
            <i nz-icon nzType="setting" nzTheme="outline"></i>
            <span>{{ getRequiredParametersCount(agent) }} params</span>
          </div>
          <div class="stat-item" *ngIf="getDependenciesCount(agent) > 0">
            <i nz-icon nzType="link" nzTheme="outline"></i>
            <span>{{ getDependenciesCount(agent) }} deps</span>
          </div>
          <div class="stat-item">
            <i nz-icon nzType="export" nzTheme="outline"></i>
            <span>{{ getOutputsCount(agent) }} outputs</span>
          </div>
        </div>

        <!-- Agent Tags -->
        <div class="agent-tags" *ngIf="agent.tags.length > 0">
          <nz-tag 
            *ngFor="let tag of agent.tags.slice(0, 3)" 
            nzSize="small"
            [nzColor]="agent.ui.color">
            {{ tag }}
          </nz-tag>
          <nz-tag 
            *ngIf="agent.tags.length > 3" 
            nzSize="small"
            nzColor="default">
            +{{ agent.tags.length - 3 }}
          </nz-tag>
        </div>
      </div>

      <!-- Agent Actions -->
      <div class="item-right" *ngIf="showActions">
        <div class="agent-actions">
          <button 
            nz-button 
            nzType="text" 
            nzSize="small"
            (click)="onAgentPin(agent); $event.stopPropagation()"
            nz-tooltip
            nzTooltipTitle="Pin agent">
            <i nz-icon nzType="pushpin" nzTheme="outline"></i>
          </button>
          
          <button 
            nz-button 
            nzType="default" 
            nzSize="small"
            (click)="onAgentConfigure(agent); $event.stopPropagation()">
            <i nz-icon nzType="setting" nzTheme="outline"></i>
            Configure
          </button>
          
          <button 
            nz-button 
            nzType="primary" 
            nzSize="small"
            (click)="onAgentExecute(agent); $event.stopPropagation()">
            <i nz-icon nzType="play-circle" nzTheme="outline"></i>
            Execute
          </button>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-list" *ngIf="agents.length === 0 && !loading">
      <nz-list-item *nzNoResult>
        <nz-empty 
          nzNotFoundContent="No agents found">
        </nz-empty>
      </nz-list-item>
    </div>
  </div>
</div>
